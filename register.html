<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>자료 등록 | 학습자료 공유 서비스</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><a href="index.html"><h1>학습자료 공유 서비스</h1></a></header>
<main>
  <div class="top-actions"><h2>학습자료 등록</h2><a class="back" href="index.html">← 홈으로</a></div>
  <form id="registerForm" novalidate>
    <div class="field"><label for="title">제목 <span class="required">*</span></label><input id="title" placeholder="자료 제목을 입력하세요"></div>
    <div class="field"><label for="description">설명</label><textarea id="description" rows="4" placeholder="자료 설명을 입력하세요"></textarea></div>
    <div class="field"><label for="subject">과목 <span class="required">*</span></label><select id="subject"></select></div>
    <div class="field"><label for="unit">단원 <span class="required">*</span></label><select id="unit" disabled><option value="">먼저 과목을 선택하세요</option></select></div>
    <div class="field"><label for="type">자료 유형 <span class="required">*</span></label><select id="type"></select></div>
    <div class="field"><label for="tags">태그</label><input id="tags" placeholder="예: 화학결합, 공유결합"></div>
    <div class="field"><label for="pdf">PDF 파일 <span class="required">*</span></label><input id="pdf" type="file" accept=".pdf,application/pdf"></div>
    <p class="hint">* 표시는 필수 항목입니다.</p>
    <button type="submit">자료 등록</button>
    <p id="message" class="message" aria-live="polite"></p>
  </form>
</main>
<script src="data.js"></script>
<script>
const subject = document.getElementById("subject");
const unit = document.getElementById("unit");
const type = document.getElementById("type");
fillSubjects(subject, "과목을 선택하세요");
fillTypes(type, "자료 유형을 선택하세요");
subject.addEventListener("change", () => fillUnits(subject.value, unit, "단원을 선택하세요"));

document.getElementById("registerForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const title = document.getElementById("title").value.trim();
  const pdf = document.getElementById("pdf").files[0];
  const message = document.getElementById("message");
  message.className = "message";

  if (!title) { message.textContent = "제목을 입력하세요."; message.classList.add("error"); return; }
  if (!subject.value) { message.textContent = "과목을 선택하세요."; message.classList.add("error"); return; }
  if (!unit.value) { message.textContent = "단원을 선택하세요."; message.classList.add("error"); return; }
  if (!type.value) { message.textContent = "자료 유형을 선택하세요."; message.classList.add("error"); return; }
  if (!pdf) { message.textContent = "PDF 파일을 선택하세요."; message.classList.add("error"); return; }
  if (!pdf.name.toLowerCase().endsWith(".pdf")) { message.textContent = "PDF 파일만 등록할 수 있습니다."; message.classList.add("error"); return; }

  // 프론트 단계의 임시 등록: 브라우저 localStorage에 메타데이터 저장
  // 보안상 브라우저는 선택한 로컬 PDF 자체를 localStorage에 저장하지 않는다.
  const saved = JSON.parse(localStorage.getItem("materials") || "[]");
  saved.push({
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
    title,
    description: document.getElementById("description").value.trim(),
    subject: subject.value,
    unit: unit.value,
    type: type.value,
    tags: document.getElementById("tags").value.trim(),
    fileName: pdf.name,
    createdAt: new Date().toISOString()
  });
  localStorage.setItem("materials", JSON.stringify(saved));
  message.textContent = "등록되었습니다. 현재 버전에서는 자료 정보와 PDF 파일명만 이 브라우저에 임시 저장됩니다.";
  message.classList.add("success");
  e.target.reset();
  unit.innerHTML = '<option value="">먼저 과목을 선택하세요</option>';
  unit.disabled = true;
});
</script>
</body></html>
